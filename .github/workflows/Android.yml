name: Android

on:
  pull_request:
  push:
    branches:
    - master
    - android-diag
  workflow_dispatch:

jobs:
  android:
    # Hardware-accelerated Android emulator is only available for x86 and x86_64
    # images on x86_64 Linux runners with KVM. ARM ABIs are tested on an x86_64
    # image that can run ARM executables using binary translation.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python versions
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 34, emulator-target: default }
          # ABIs
          # ARM executables run using binary translation, which does not support fork(): only the tests that do not start processes are run
          # Minimum API level: the configuration checks cannot be run on the device, because "adb shell"
          # does not return the exit code before API level 24, so the results are taken from AndroidTryRunResults.cmake
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: x86_64, emulator-arch: x86_64, emulator-api-level: 21, emulator-target: default, cache-preset: cmake/AndroidTryRunResults.cmake, name-suffix: "-api21" }
          - { python-version: 3.12.10, python-for-build-version: "3.12", android-abi: x86, emulator-arch: x86, emulator-api-level: 21, emulator-target: default, cache-preset: cmake/AndroidTryRunResults.cmake, name-suffix: "-api21" }
          # Extensions built into the interpreter

    name: python-${{ matrix.python-version }}-android-${{ matrix.android-abi }}${{ matrix.name-suffix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup ninja
      uses: ashutoshvarma/setup-ninja@66ad2db9ed7d211c065daeeb849e9c8c895773c9 # master
      with:
        version: 1.10.0

    # Python of the same major.minor version for the build host, used to generate
    # the frozen modules and the sysconfig data
    - name: Setup Python for build
      id: python-for-build
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-for-build-version }}

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The emulator must be running during configuration, as configuration checks
    # are executed on the target using "run_on_android.sh".
    - name: Build & Test
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      env:
        ANDROID_ABI: ${{ matrix.android-abi }}
        ANDROID_PLATFORM: 21
        PY_VERSION: ${{ matrix.python-version }}
        PYTHON_FOR_BUILD: ${{ steps.python-for-build.outputs.python-path }}
        EXTRA_CMAKE_ARGS: ${{ matrix.extra-cmake-args }}
        UNIT_TESTS: ${{ matrix.unit-tests || 'all' }}
        CACHE_PRESET: ${{ matrix.cache-preset }}
      with:
        api-level: ${{ matrix.emulator-api-level }}
        arch: ${{ matrix.emulator-arch }}
        target: ${{ matrix.emulator-target }}
        disable-animations: true
        emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
        script: ANDROID_NDK=$ANDROID_NDK_LATEST_HOME bash .github/scripts/android_build_and_test.sh

